name = "webcad-planner"
main = "worker.mjs"
compatibility_date = "2026-07-26"

# Workers Builds(Gitからの自動デプロイ)は、ダッシュボードにビルドコマンドが
# 設定されていないと、いきなり `wrangler versions upload` を実行する。
# dist/ は .gitignore 対象でリポジトリに無いため、そのままでは
# 「assets.directory が存在しない」で必ず失敗する。
# ここに書いておけば wrangler がアップロードの前に dist/ を作る。
# SKIP_DEPLOY=1 は build.sh 末尾の `npx wrangler deploy` を止めるため
# (ここでの用途はビルドだけで、配信は wrangler 側が行う)。
[build]
command = "SKIP_DEPLOY=1 bash build.sh"

# 本番で落ちたとき、例外の文面が読めるようにしておく。
#
# 無効のままだと、残るのは Cloudflare が返す HTML のエラーページだけで、
# 「HTTP 500 だった」以上のことが分からない。実測で、読み取りが本番で落ちた
# 原因の特定に、推測からの往復を何度も重ねることになった。
# 無料プランでも1日20万件まで記録できる。
[observability]
enabled = true

[assets]
directory = "dist"
not_found_handling = "single-page-application"
binding = "ASSETS"
run_worker_first = [ "/api/*" ]

# 読み取りの周りの「文章は要らないが判断は要る」ところで Jev を呼ぶ。
# worker/jev.mjs を見ること。**鍵が要らない**(バインディング経由)ので、
# この Worker に新しい秘密が増えない。送り先も増えない。
# 無くても動く。無ければ門が開きっぱなしになり、門が無かった頃と同じ動きになる。
[ai]
binding = "AI"

[[r2_buckets]]
binding = "PLANS"
bucket_name = "webcad-shared-plans"
preview_bucket_name = "webcad-shared-plans-preview"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "CollaborationRoom"

# AI の使用回数を数える。/api/ai/* には認証が無いので、ここが費用の歯止め。
[[durable_objects.bindings]]
name = "AI_QUOTA"
class_name = "AiQuota"

[[migrations]]
tag = "v1"
new_sqlite_classes = [ "CollaborationRoom" ]

[[migrations]]
tag = "v2"
new_sqlite_classes = [ "AiQuota" ]
