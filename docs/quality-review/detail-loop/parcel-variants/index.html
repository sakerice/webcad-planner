<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>宅配ボックスのバリエーション</title><style>body{background:#f5f3ed;color:#263638;font:16px/1.7 system-ui;max-width:1100px;margin:auto;padding:24px}section{margin:30px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}img{width:100%;border-radius:18px}h1{font-size:28px}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style><h1>戸建て向け宅配ポスト 3つの追加形状</h1><p>既存の宅配ボックスに追加。メーカー公式モデルではなく、住宅配置用に独自制作した汎用モデルです。本体と扉の色・艶を個別に変更できます。</p><section><h2>薄型機能門柱</h2><p>幅 × 奥行 × 高さ：340 × 220 × 1500 mm</p><div class="grid"><img src="original-parcel-slim-column-front.png" alt="薄型機能門柱 front"><img src="original-parcel-slim-column-back.png" alt="薄型機能門柱 back"><img src="original-parcel-slim-column-finish.png" alt="薄型機能門柱 finish"></div></section><section><h2>一体型機能門柱</h2><p>幅 × 奥行 × 高さ：470 × 440 × 1500 mm</p><div class="grid"><img src="original-parcel-integrated-column-front.png" alt="一体型機能門柱 front"><img src="original-parcel-integrated-column-back.png" alt="一体型機能門柱 back"><img src="original-parcel-integrated-column-finish.png" alt="一体型機能門柱 finish"></div></section><section><h2>二本脚型</h2><p>幅 × 奥行 × 高さ：460 × 450 × 1150 mm</p><div class="grid"><img src="original-parcel-pole-mounted-front.png" alt="二本脚型 front"><img src="original-parcel-pole-mounted-back.png" alt="二本脚型 back"><img src="original-parcel-pole-mounted-finish.png" alt="二本脚型 finish"></div></section><p>参考：<a href="https://www.lixil.co.jp/lineup/gate_fence/function-ft/">LIXIL 機能門柱FT</a> ／ <a href="https://www.lixil.co.jp/lineup/gate_fence/smartpost/">LIXIL スマート宅配ポスト</a> ／ <a href="https://news.panasonic.com/jp/press/jn250709-3">Panasonic コンボマルチ</a></p>
