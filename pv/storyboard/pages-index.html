<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>house-planner mobile — PV review</title>
  <style>
    :root { color-scheme: light; --paper:#f7f2ea; --ink:#292b32; --muted:#68707b; --card:#fff; --coral:#ff4e3d; --line:#e3dbd0; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:var(--paper); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif; }
    main { width:min(760px,100%); margin:0 auto; padding:clamp(36px,8vw,88px) 20px 64px; }
    .eyebrow { color:var(--coral); font-size:13px; font-weight:900; letter-spacing:.12em; }
    h1 { margin:10px 0 12px; font-size:clamp(34px,8vw,64px); line-height:1; letter-spacing:-.05em; }
    .intro { margin:0 0 34px; color:var(--muted); line-height:1.8; }
    article { padding:24px; border:1px solid var(--line); border-radius:24px; background:var(--card); box-shadow:0 14px 36px rgba(41,43,50,.08); }
    .status { display:inline-block; margin-bottom:14px; padding:7px 10px; border-radius:999px; background:#fff0ec; color:#a54135; font-size:12px; font-weight:900; }
    h2 { margin:0 0 9px; font-size:26px; }
    p { line-height:1.7; }
    .meta { color:var(--muted); font-size:14px; }
    a.button { display:flex; justify-content:center; margin-top:22px; padding:15px 18px; border-radius:14px; background:var(--ink); color:#fff; font-weight:900; text-decoration:none; }
    footer { margin-top:24px; color:var(--muted); font-size:12px; line-height:1.7; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">PV REVIEW</div>
    <h1>house-planner mobile</h1>
    <p class="intro">開発検討中のPV絵コンテを、PC・スマートフォンから確認するためのレビューページです。</p>
    <article>
      <span class="status">提案段階</span>
      <h2>Storyboard v5</h2>
      <p>32秒 / 16:9 / exact-first layered master</p>
      <p class="meta">正確な製品映像を基幹版とし、承認済み生成素材のみを品質向上層として扱います。</p>
      <a class="button" href="./pv/storyboard/v5/">絵コンテを確認する</a>
    </article>
    <footer>このページはレビュー用途です。掲載内容は完成PVや公開仕様を示すものではありません。</footer>
  </main>
</body>
</html>
